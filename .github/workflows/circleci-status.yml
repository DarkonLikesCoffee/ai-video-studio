name: Check CircleCI render status

on:
  push:
    branches: [main]
    paths:
      - circleci-status-request.json

permissions:
  contents: read

concurrency:
  group: circleci-status-check
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate status request
        id: request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const request = JSON.parse(fs.readFileSync("circleci-status-request.json", "utf8"));
          if (typeof request.pipelineId !== "string" ||
              !/^[0-9a-f-]{36}$/i.test(request.pipelineId)) {
            throw new Error("pipelineId must be a CircleCI pipeline UUID");
          }
          if (typeof request.requestId !== "string" ||
              !/^[A-Za-z0-9._-]{1,80}$/.test(request.requestId)) {
            throw new Error("requestId must be a unique 1-80 character identifier");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `pipeline_id=${request.pipelineId}\nrequest_id=${request.requestId}\n`);
          NODE

      - name: Query CircleCI workflow, job and artifacts
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PROJECT_SLUG: ${{ secrets.CIRCLECI_PROJECT_SLUG }}
          PIPELINE_ID: ${{ steps.request.outputs.pipeline_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CIRCLECI_TOKEN:?Missing GitHub secret CIRCLECI_TOKEN}"
          : "${CIRCLECI_PROJECT_SLUG:?Missing GitHub secret CIRCLECI_PROJECT_SLUG}"

          api() {
            curl --fail --silent --show-error \
              --header "Circle-Token: $CIRCLECI_TOKEN" \
              --header "Accept: application/json" "$1"
          }

          pipeline_url="https://app.circleci.com/pipelines/$CIRCLECI_PROJECT_SLUG/$PIPELINE_ID"
          workflows="$(api "https://circleci.com/api/v2/pipeline/$PIPELINE_ID/workflow")"
          workflow_id="$(jq -r '.items[0].id // empty' <<< "$workflows")"
          workflow_status="$(jq -r '.items[0].status // "unknown"' <<< "$workflows")"

          if [[ -z "$workflow_id" ]]; then
            echo "::error::CircleCI returned no workflow for pipeline $PIPELINE_ID"
            echo "No CircleCI workflow found for pipeline $PIPELINE_ID" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          jobs="$(api "https://circleci.com/api/v2/workflow/$workflow_id/job")"
          job_status="$(jq -r '.items[0].status // "unknown"' <<< "$jobs")"
          job_name="$(jq -r '.items[0].name // "render"' <<< "$jobs")"
          job_number="$(jq -r '.items[0].job_number // empty' <<< "$jobs")"

          {
            echo "## CircleCI render status"
            echo ""
            printf -- '- Request: `%s`\n' "$REQUEST_ID"
            echo "- Pipeline: [$PIPELINE_ID]($pipeline_url)"
            printf -- '- Workflow: `%s`\n' "$workflow_status"
            echo "- Job ($job_name): **$job_status**"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "CircleCI pipeline $PIPELINE_ID: workflow=$workflow_status job=$job_status"

          if [[ "$job_status" == "success" && -n "$job_number" ]]; then
            artifacts="$(api "https://circleci.com/api/v2/project/$CIRCLECI_PROJECT_SLUG/$job_number/artifacts")"
            count="$(jq '.items | length' <<< "$artifacts")"
            if [[ "$count" -eq 0 ]]; then
              echo "The render job succeeded, but CircleCI returned no artifacts." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "### MP4 artifacts" >> "$GITHUB_STEP_SUMMARY"
              while IFS=$'\t' read -r path url; do
                [[ -n "$url" ]] || continue
                echo "- [$path]($url)" | tee -a "$GITHUB_STEP_SUMMARY"
                echo "Artifact: $path — $url"
              done < <(jq -r '.items[] | [.path, .url] | @tsv' <<< "$artifacts")
            fi
          elif [[ "$job_status" == "failed" || "$workflow_status" == "failed" ]]; then
            echo "::error::CircleCI render failed. Open the pipeline link for job logs."
            exit 1
          else
            echo "Render is not finished yet. Run the status check again later." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
