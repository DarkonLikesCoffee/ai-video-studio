name: Render video

on:
  workflow_dispatch:
    inputs:
      output_name:
        description: Name of the MP4 artifact (letters, numbers, hyphens)
        required: true
        default: ai-video-studio-demo
        type: string

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate demo project
        run: npm run validate:demo
      - name: Render MP4
        working-directory: packages/video-engine
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          if [[ ! "$OUTPUT_NAME" =~ ^[A-Za-z0-9-]{1,60}$ ]]; then
            echo "Invalid output name. Use 1-60 letters, numbers, or hyphens."
            exit 1
          fi
          mkdir -p ../../render-output
          npx remotion render src/index.ts DemoVideo "../../render-output/$OUTPUT_NAME.mp4"
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: render-output/${{ inputs.output_name }}.mp4
          if-no-files-found: error
          retention-days: 3
