name: Render video

on:
  push:
    branches: [main]
    paths:
      - render-request.json

permissions:
  contents: read

concurrency:
  group: render-request
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate render request
        id: request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const request = JSON.parse(fs.readFileSync("render-request.json", "utf8"));
          const allowedProviders = new Set(["github-actions", "circleci"]);
          if (!allowedProviders.has(request.provider)) {
            throw new Error("provider must be github-actions or circleci");
          }
          if (typeof request.projectPath !== "string" ||
              !/^projects\/[A-Za-z0-9_-]+(?:\/[A-Za-z0-9_-]+)*\.json$/.test(request.projectPath)) {
            throw new Error("projectPath must point to a JSON file inside projects/");
          }
          if (typeof request.outputName !== "string" ||
              !/^[A-Za-z0-9][A-Za-z0-9-]{0,59}$/.test(request.outputName)) {
            throw new Error("outputName must contain 1-60 letters, numbers, or hyphens");
          }
          if (request.compositionId !== "DemoVideo") {
            throw new Error("Only the registered DemoVideo composition is supported at this stage");
          }
          if (typeof request.requestId !== "string" ||
              !/^[A-Za-z0-9._-]{1,80}$/.test(request.requestId)) {
            throw new Error("requestId must be a unique 1-80 character identifier");
          }
          const scene = JSON.parse(fs.readFileSync(request.projectPath, "utf8"));
          if (scene?.composition?.id !== request.compositionId) {
            throw new Error("The selected scene composition ID does not match the requested composition");
          }
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, [
            `provider=${request.provider}`,
            `project_path=${request.projectPath}`,
            `composition_id=${request.compositionId}`,
            `output_name=${request.outputName}`,
            `request_id=${request.requestId}`
          ].join("\n") + "\n");
          console.log(`Accepted render request ${request.requestId} for ${request.provider}`);
          NODE

      - name: Install dependencies
        if: steps.request.outputs.provider == 'github-actions'
        run: npm install --no-audit --no-fund

      - name: Validate selected project
        if: steps.request.outputs.provider == 'github-actions'
        env:
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
        run: npm run validate:project -- "$PROJECT_PATH"

      - name: Render MP4 with GitHub Actions
        if: steps.request.outputs.provider == 'github-actions'
        env:
          COMPOSITION_ID: ${{ steps.request.outputs.composition_id }}
          OUTPUT_NAME: ${{ steps.request.outputs.output_name }}
        run: |
          mkdir -p render-output
          npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4"

      - name: Upload MP4 artifact
        if: steps.request.outputs.provider == 'github-actions'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.output_name }}
          path: render-output/${{ steps.request.outputs.output_name }}.mp4
          if-no-files-found: error
          retention-days: 3

      - name: Trigger CircleCI render
        if: steps.request.outputs.provider == 'circleci'
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PROJECT_SLUG: ${{ secrets.CIRCLECI_PROJECT_SLUG }}
          CIRCLECI_PIPELINE_DEFINITION_ID: ${{ secrets.CIRCLECI_PIPELINE_DEFINITION_ID }}
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
          COMPOSITION_ID: ${{ steps.request.outputs.composition_id }}
          OUTPUT_NAME: ${{ steps.request.outputs.output_name }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CIRCLECI_TOKEN:?Missing GitHub secret CIRCLECI_TOKEN}"
          : "${CIRCLECI_PROJECT_SLUG:?Missing GitHub secret CIRCLECI_PROJECT_SLUG}"
          : "${CIRCLECI_PIPELINE_DEFINITION_ID:?Missing GitHub secret CIRCLECI_PIPELINE_DEFINITION_ID}"

          IFS='/' read -r provider organization project extra <<< "$CIRCLECI_PROJECT_SLUG"
          if [[ -z "$provider" || -z "$organization" || -z "$project" || -n "${extra:-}" ]]; then
            echo "::error::CIRCLECI_PROJECT_SLUG must contain exactly three slash-separated parts."
            exit 1
          fi
          case "$provider" in
            github|gh|circleci) ;;
            *)
              echo "::error::Unsupported CircleCI project slug provider: $provider"
              exit 1
              ;;
          esac
          if [[ ! "$CIRCLECI_PIPELINE_DEFINITION_ID" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "::error::CIRCLECI_PIPELINE_DEFINITION_ID must be a UUID."
            exit 1
          fi

          payload="$(jq -n \
            --arg definition_id "$CIRCLECI_PIPELINE_DEFINITION_ID" \
            --arg project_path "$PROJECT_PATH" \
            --arg composition_id "$COMPOSITION_ID" \
            --arg output_name "$OUTPUT_NAME" \
            --arg request_id "$REQUEST_ID" \
            '{
              definition_id: $definition_id,
              config: {branch: "main"},
              checkout: {branch: "main"},
              parameters: {
                render_video: true,
                project_path: $project_path,
                composition_id: $composition_id,
                output_name: $output_name,
                request_id: $request_id
              }
            }')"

          response="$(curl --fail --silent --show-error \
            --request POST \
            "https://circleci.com/api/v2/project/$provider/$organization/$project/pipeline/run" \
            --header "Circle-Token: $CIRCLECI_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload")"

          pipeline_id="$(jq -r '.id // empty' <<< "$response")"
          if [[ -z "$pipeline_id" ]]; then
            echo "::error::CircleCI did not return a pipeline ID."
            echo "$response"
            exit 1
          fi

          echo "CircleCI accepted render request $REQUEST_ID (pipeline $pipeline_id)." >> "$GITHUB_STEP_SUMMARY"
          echo "Open the [CircleCI project](https://app.circleci.com/pipelines/$CIRCLECI_PROJECT_SLUG) to follow the render and retrieve its MP4 artifact." >> "$GITHUB_STEP_SUMMARY"
