name: Render video

on:
  push:
    branches: [main, "fix/**", "feat/cinematic-motion-qa", "feat/user-gameplay-footage-pipeline"]
    paths:
      - render-request.json

permissions:
  contents: read

concurrency:
  group: render-request
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate render request
        id: request
        run: node scripts/render-request.mjs render-request.json

      - name: Install dependencies
        if: steps.request.outputs.provider == 'github-actions'
        run: npm install --no-audit --no-fund

      - name: Set up Python for optional narration
        if: steps.request.outputs.provider == 'github-actions' && steps.request.outputs.narration_path != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Kokoro model files
        if: steps.request.outputs.provider == 'github-actions' && steps.request.outputs.narration_path != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai-video-studio/kokoro-v1.0
          key: kokoro-onnx-0.6.1-model-files-v1.1-${{ runner.os }}

      - name: Install optional TTS dependencies
        if: steps.request.outputs.provider == 'github-actions' && steps.request.outputs.narration_path != ''
        run: python -m pip install --disable-pip-version-check -r requirements-tts.txt

      - name: Ensure FFmpeg is available
        if: steps.request.outputs.provider == 'github-actions'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Generate original audio fixtures
        if: steps.request.outputs.provider == 'github-actions'
        run: npm run assets:audio

      - name: Download approved NASA SVS footage
        if: steps.request.outputs.provider == 'github-actions' && (steps.request.outputs.composition_id == 'NarratedSkyExplainer' || (steps.request.outputs.composition_id == 'ProjectVideo' && steps.request.outputs.narration_path != ''))
        env:
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
        run: |
          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          SELECTION_PATH="$PROJECT_DIR/production/nasa-asset-selection.json"
          if [[ -f "$SELECTION_PATH" ]]; then
            node scripts/nasa-video-assets.mjs download --selection "$SELECTION_PATH" --project "$PROJECT_DIR"
          else
            echo "No approved NASA footage selection found; rendering the existing 3D-only composition." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate optional narration and word alignment
        id: narration
        if: steps.request.outputs.provider == 'github-actions' && steps.request.outputs.narration_path != ''
        env:
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
          NARRATION_PATH: ${{ steps.request.outputs.narration_path }}
        run: |
          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          mkdir -p "$PROJECT_DIR/assets/audio"
          if [[ "$PROJECT_PATH" == "projects/valorant-immortal-decision-making/scene.json" ]]; then
            cp projects/showcase-pulse/assets/audio/score.wav "$PROJECT_DIR/assets/audio/score.wav"
            cp projects/showcase-motion/assets/audio/transition-whoosh.wav "$PROJECT_DIR/assets/audio/transition-whoosh.wav"
            cp projects/showcase-motion/assets/audio/impact.wav "$PROJECT_DIR/assets/audio/impact.wav"
            cp projects/showcase-motion/assets/audio/transition-chime.wav "$PROJECT_DIR/assets/audio/transition-chime.wav"
          else
            cp projects/sora/assets/audio/score.wav "$PROJECT_DIR/assets/audio/score.wav"
            cp projects/showcase-motion/assets/audio/transition-whoosh.wav "$PROJECT_DIR/assets/audio/transition-whoosh.wav"
          fi
          python scripts/generate-narration.py \
            --config "$NARRATION_PATH" \
            --project-dir "$PROJECT_DIR" \
            --model-dir "$HOME/.cache/ai-video-studio/kokoro-v1.0"
          npm run narration:apply -- "$PROJECT_PATH" "$NARRATION_PATH" "$PROJECT_DIR/production/narration-alignment.json"
          echo "project_path=$PROJECT_DIR/.narrated-project.json" >> "$GITHUB_OUTPUT"

      - name: Validate selected ProjectVideo project
        if: steps.request.outputs.provider == 'github-actions' && steps.request.outputs.composition_id == 'ProjectVideo'
        env:
          PROJECT_PATH: ${{ steps.narration.outputs.project_path || steps.request.outputs.project_path }}
        run: npm run validate:project -- "$PROJECT_PATH"

      - name: Prepare project audio processing
        if: steps.request.outputs.provider == 'github-actions' && steps.request.outputs.composition_id == 'ProjectVideo'
        env:
          PROJECT_PATH: ${{ steps.narration.outputs.project_path || steps.request.outputs.project_path }}
        run: npm run audio:prepare -- "$PROJECT_PATH"

      - name: Render MP4 with GitHub Actions
        if: steps.request.outputs.provider == 'github-actions'
        env:
          PROJECT_PATH: ${{ steps.narration.outputs.project_path || steps.request.outputs.project_path }}
          COMPOSITION_ID: ${{ steps.request.outputs.composition_id }}
          OUTPUT_NAME: ${{ steps.request.outputs.output_name }}
        run: |
          mkdir -p render-output
          if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
            PROJECT_DIR="$(dirname "$PROJECT_PATH")"
            npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4" "--props=../../$PROJECT_DIR/.render-project.json" "--public-dir=../../$PROJECT_DIR"
          elif [[ -n "$PROJECT_PATH" ]]; then
            PROJECT_DIR="$(dirname "$PROJECT_PATH")"
            npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4" "--props=../../$PROJECT_PATH" "--public-dir=../../$PROJECT_DIR"
          else
            npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4"
          fi

      - name: Master final ProjectVideo audio
        if: steps.request.outputs.provider == 'github-actions' && steps.request.outputs.composition_id == 'ProjectVideo'
        env:
          PROJECT_PATH: ${{ steps.narration.outputs.project_path || steps.request.outputs.project_path }}
          OUTPUT_NAME: ${{ steps.request.outputs.output_name }}
        run: npm run audio:master -- "render-output/$OUTPUT_NAME.mp4" "$PROJECT_PATH"

      - name: Master final custom narrated composition audio
        if: steps.request.outputs.provider == 'github-actions' && steps.request.outputs.composition_id == 'NarratedSkyExplainer'
        env:
          OUTPUT_NAME: ${{ steps.request.outputs.output_name }}
        run: |
          ffmpeg -y -i "render-output/$OUTPUT_NAME.mp4" \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart \
            "render-output/$OUTPUT_NAME.mastered.mp4"
          mv "render-output/$OUTPUT_NAME.mastered.mp4" "render-output/$OUTPUT_NAME.mp4"

      - name: Run rendered-media diagnostics
        if: steps.request.outputs.provider == 'github-actions'
        env:
          OUTPUT_NAME: ${{ steps.request.outputs.output_name }}
        run: npm run qa:media -- "render-output/$OUTPUT_NAME.mp4"

      - name: Write footage attribution credits
        if: steps.request.outputs.provider == 'github-actions' && steps.request.outputs.composition_id == 'NarratedSkyExplainer'
        env:
          PROJECT_PATH: ${{ steps.narration.outputs.project_path || steps.request.outputs.project_path }}
          OUTPUT_NAME: ${{ steps.request.outputs.output_name }}
        run: |
          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          npx tsx scripts/write-footage-credits.ts "$PROJECT_DIR/production/asset-manifest.json" "render-output/$OUTPUT_NAME-credits.txt"

      - name: Upload MP4 artifact
        if: steps.request.outputs.provider == 'github-actions'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.output_name }}
          path: |
            render-output/${{ steps.request.outputs.output_name }}.mp4
            render-output/${{ steps.request.outputs.output_name }}-credits.txt
            render-output/${{ steps.request.outputs.output_name }}.qa.json
          if-no-files-found: error
          retention-days: 3

      - name: Trigger CircleCI render
        if: steps.request.outputs.provider == 'circleci'
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          CIRCLECI_PROJECT_SLUG: ${{ secrets.CIRCLECI_PROJECT_SLUG }}
          CIRCLECI_PIPELINE_DEFINITION_ID: ${{ secrets.CIRCLECI_PIPELINE_DEFINITION_ID }}
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
          NARRATION_PATH: ${{ steps.request.outputs.narration_path }}
          COMPOSITION_ID: ${{ steps.request.outputs.composition_id }}
          OUTPUT_NAME: ${{ steps.request.outputs.output_name }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CIRCLECI_TOKEN:?Missing GitHub secret CIRCLECI_TOKEN}"
          : "${CIRCLECI_PROJECT_SLUG:?Missing GitHub secret CIRCLECI_PROJECT_SLUG}"
          : "${CIRCLECI_PIPELINE_DEFINITION_ID:?Missing GitHub secret CIRCLECI_PIPELINE_DEFINITION_ID}"

          IFS='/' read -r provider organization project extra <<< "$CIRCLECI_PROJECT_SLUG"
          if [[ -z "$provider" || -z "$organization" || -z "$project" || -n "${extra:-}" ]]; then
            echo "::error::CIRCLECI_PROJECT_SLUG must contain exactly three slash-separated parts."
            exit 1
          fi
          case "$provider" in
            github|gh|circleci) ;;
            *)
              echo "::error::Unsupported CircleCI project slug provider: $provider"
              exit 1
              ;;
          esac
          if [[ ! "$CIRCLECI_PIPELINE_DEFINITION_ID" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "::error::CIRCLECI_PIPELINE_DEFINITION_ID must be a UUID."
            exit 1
          fi

          payload="$(jq -n \
            --arg definition_id "$CIRCLECI_PIPELINE_DEFINITION_ID" \
            --arg project_path "$PROJECT_PATH" \
            --arg composition_id "$COMPOSITION_ID" \
            --arg narration_path "$NARRATION_PATH" \
            --arg output_name "$OUTPUT_NAME" \
            --arg request_id "$REQUEST_ID" \
            '{
              definition_id: $definition_id,
              config: {branch: "main"},
              checkout: {branch: "main"},
              parameters: {
                render_video: true,
                project_path: $project_path,
                composition_id: $composition_id,
                narration_path: $narration_path,
                output_name: $output_name,
                request_id: $request_id
              }
            }')"

          response="$(curl --fail --silent --show-error \
            --request POST \
            "https://circleci.com/api/v2/project/$provider/$organization/$project/pipeline/run" \
            --header "Circle-Token: $CIRCLECI_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload")"

          pipeline_id="$(jq -r '.id // empty' <<< "$response")"
          if [[ -z "$pipeline_id" ]]; then
            echo "::error::CircleCI did not return a pipeline ID."
            echo "$response"
            exit 1
          fi

          pipeline_url="https://app.circleci.com/pipelines/$CIRCLECI_PROJECT_SLUG/$pipeline_id"
          echo "CircleCI accepted render request $REQUEST_ID (pipeline $pipeline_id)." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Pipeline URL: $pipeline_url" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "To check this render later, update circleci-status-request.json with this pipeline ID." | tee -a "$GITHUB_STEP_SUMMARY"
