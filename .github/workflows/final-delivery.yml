name: Final video delivery

on:
  workflow_dispatch:
    inputs:
      render_run_id:
        description: GitHub Actions run ID that produced the review artifact
        required: true
        type: string
      output_name:
        description: Exact render output name (without .mp4)
        required: true
        type: string
      review_report_path:
        description: Committed approved projects/<slug>/production/visual-review.json path on main
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the committed approval record
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate dispatch inputs
        env:
          RENDER_RUN_ID: \${{ inputs.render_run_id }}
          OUTPUT_NAME: \${{ inputs.output_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$RENDER_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::render_run_id must be a numeric GitHub Actions run ID."
            exit 1
          fi
          if [[ ! "$OUTPUT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ || "$OUTPUT_NAME" == *..* ]]; then
            echo "::error::output_name must be a safe filename slug."
            exit 1
          fi

      - name: Download the exact render review artifact
        uses: actions/download-artifact@v4
        with:
          name: \${{ inputs.output_name }}
          run-id: \${{ inputs.render_run_id }}
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: render-output

      - name: Validate approval, hash, technical QA and provenance
        env:
          GITHUB_REPOSITORY: \${{ github.repository }}
          RENDER_RUN_ID: \${{ inputs.render_run_id }}
          OUTPUT_NAME: \${{ inputs.output_name }}
          REVIEW_REPORT_PATH: \${{ inputs.review_report_path }}
        run: |
          npx tsx scripts/validate-final-delivery.ts \
            --artifact-dir render-output \
            --output-name "$OUTPUT_NAME" \
            --review-report "$REVIEW_REPORT_PATH" \
            --expected-run-id "$RENDER_RUN_ID"

      - name: Upload the approved final delivery package
        uses: actions/upload-artifact@v4
        with:
          name: \${{ inputs.output_name }}-final-delivery
          path: render-output/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize final delivery
        env:
          OUTPUT_NAME: \${{ inputs.output_name }}
          RENDER_RUN_ID: \${{ inputs.render_run_id }}
        run: |
          {
            echo "## Final video delivery approved"
            echo "- Output: $OUTPUT_NAME"
            echo "- Render run: $RENDER_RUN_ID"
            echo "- MP4 SHA-256: $(node -e "const r=require('./render-output/' + process.env.OUTPUT_NAME + '.delivery.json'); process.stdout.write(r.video.sha256)")"
            echo "- Delivery manifest: $OUTPUT_NAME.delivery.json"
            echo "- Final artifact: $OUTPUT_NAME-final-delivery"
          } >> "$GITHUB_STEP_SUMMARY"
