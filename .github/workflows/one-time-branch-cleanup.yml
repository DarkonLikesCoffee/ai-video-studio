name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-stale-branches:
    if: github.event.head_commit.message == 'chore: one-time branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Keep main and delete every other branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (repository.default_branch !== "main") {
              core.setFailed(`Expected default branch main, found ${repository.default_branch}`);
              return;
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });
            const stale = branches.filter(branch => branch.name !== "main");
            core.info(`Found ${branches.length} branches; deleting ${stale.length} and preserving main.`);

            const failures = [];
            for (const branch of stale) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`
                });
                core.info(`Deleted ${branch.name}`);
              } catch (error) {
                failures.push(`${branch.name}: ${error.message}`);
                core.error(`Could not delete ${branch.name}: ${error.message}`);
              }
            }

            core.summary.addHeading("Branch cleanup");
            core.summary.addRaw(`Preserved main. Deleted ${stale.length - failures.length} of ${stale.length} non-main branches.`);
            await core.summary.write();

            if (failures.length) {
              core.setFailed(failures.join("\n"));
            }
