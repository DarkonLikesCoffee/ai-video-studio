name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - render-request.json
      - circleci-status-request.json
  pull_request:
    branches: [main]
    paths-ignore:
      - render-request.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Generate original audio fixtures
        run: npm run assets:audio
      - name: Validate original demo project
        run: npm run validate:demo
      - name: Validate legacy data-driven example
        run: npm run validate:project -- projects/examples/three-scene-story/scene.json
      - name: Validate Aether motion showcase
        run: npm run validate:project -- projects/showcase-motion/scene.json
      - name: Validate cinematic transition showcase
        run: npm run validate:project -- projects/showcase-transitions/scene.json
      - name: Prepare track DSP and sidechain processing
        run: npm run audio:prepare -- projects/showcase-motion/scene.json
      - name: Resolve cinematic ad benchmark composition
        run: npx remotion compositions packages/video-engine/src/index.ts --public-dir=projects/showcase-pulse
      - name: Render cinematic 3D product ad benchmark
        run: npx remotion render packages/video-engine/src/index.ts CinematicAdBenchmark render-output/cinematic-3d-ad-benchmark.mp4 --gl=swangle --public-dir=projects/showcase-pulse
      - name: Build studio
        run: npm run build
      - name: Upload cinematic 3D ad benchmark
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-3d-ad-benchmark
          path: render-output/cinematic-3d-ad-benchmark.mp4
          if-no-files-found: error
          retention-days: 3
