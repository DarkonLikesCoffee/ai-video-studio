name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - render-request.json
      - circleci-status-request.json
  pull_request:
    branches: [main]
    paths-ignore:
      - render-request.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Generate original sample audio fixtures
        run: npm run assets:audio
      - name: Validate demo project
        run: npm run validate:demo
      - name: Validate data-driven example
        run: npm run validate:project -- projects/examples/three-scene-story/scene.json
      - name: Resolve Remotion compositions with project props
        run: npx remotion compositions packages/video-engine/src/index.ts --props=projects/examples/three-scene-story/scene.json --public-dir="$GITHUB_WORKSPACE/projects/examples/three-scene-story"
      - name: Render video, animation and audio smoke test
        run: |
          mkdir -p render-output
          npm run render:custom -- ProjectVideo ../../render-output/m3-audio-engine-smoke-test.mp4 --props=../../projects/examples/three-scene-story/scene.json --public-dir=../../projects/examples/three-scene-story
      - name: Build studio
        run: npm run build
      - name: Upload media smoke test video
        uses: actions/upload-artifact@v4
        with:
          name: m3-audio-engine-smoke-test
          path: render-output/m3-audio-engine-smoke-test.mp4
          if-no-files-found: error
          retention-days: 3
