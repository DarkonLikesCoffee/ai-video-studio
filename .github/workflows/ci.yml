name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
    paths-ignore:
      - render-request.json
      - circleci-status-request.json
  pull_request:
    branches: [main]
    paths-ignore:
      - render-request.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json', 'package-lock.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Set up Python for narration adapter tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Test narration alignment mapping
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Type-check
        run: npm run typecheck
      - name: Ensure FFmpeg and FFprobe are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Test
        env:
          MEDIA_QA_INTEGRATION_REQUIRED: "1"
        run: npm test
      - name: Validate example production plan
        run: npm run validate:plan -- projects/examples/production-plan.json
      - name: Validate Stormlight Keeper production plan
        run: npm run validate:plan -- projects/stormlight-keeper/production/production-plan.json
      - name: Validate Jumping Cat production plan
        run: npm run validate:plan -- projects/jumping-cat/production/production-plan.json
      - name: Run Jumping Cat storyboard QA
        run: npm run storyboard:qa -- projects/jumping-cat/production/production-plan.json
      - name: Validate Tiny Astronaut production plan
        run: npm run validate:plan -- projects/tiny-astronaut-crystal-cave/production/production-plan.json
      - name: Run Tiny Astronaut storyboard QA
        run: npm run storyboard:qa -- projects/tiny-astronaut-crystal-cave/production/production-plan.json
      - name: Validate Golden Hour production plan
        run: npm run validate:plan -- projects/golden-hour-dog-walk/production/production-plan.json
      - name: Run Golden Hour storyboard QA
        run: npm run storyboard:qa -- projects/golden-hour-dog-walk/production/production-plan.json
      - name: Run Stormlight Keeper storyboard QA
        run: npm run storyboard:qa -- projects/stormlight-keeper/production/production-plan.json
      - name: Test machine-readable production state validator
        run: npm test -- --test-name-pattern "production state|production stages"
      - name: Generate storyboard planning previews
        run: |
          mkdir -p review-output
          npm run storyboard:preview -- projects/examples/production-plan.json review-output/launch-film.html
          npm run storyboard:preview -- projects/valorant-immortal-decision-making/production/production-plan.json review-output/valorant.html
      - name: Upload storyboard planning previews
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-planning-previews
          path: review-output/*.html
          retention-days: 7
      - name: Render Tiny Astronaut scene still previews
        run: node scripts/qa-tiny-astronaut-previews.mjs review-output/tiny-astronaut
      - name: Upload Tiny Astronaut scene still previews
        uses: actions/upload-artifact@v4
        with:
          name: tiny-astronaut-scene-still-previews
          path: review-output/tiny-astronaut/*.png
          retention-days: 7
      - name: Generate storyboard critic report on launch-film example
        run: npm run storyboard:critic -- projects/examples/production-plan.json review-output/launch-film-critique.md
      - name: Run storyboard risk report on launch-film example
        run: npm run storyboard:qa -- projects/examples/production-plan.json
      - name: Run storyboard risk report on narrated explainer
        run: npm run storyboard:qa -- projects/examples/narrated-explainer/production/production-plan.json
      - name: Run storyboard risk report on SORA
        run: npm run storyboard:qa -- projects/sora/production/production-plan.json
      - name: Run storyboard risk report on VALORANT
        run: npm run storyboard:qa -- projects/valorant-immortal-decision-making/production/production-plan.json
      - name: Validate narrated explainer footage storyboard
        run: npm run validate:plan -- projects/examples/narrated-explainer/production/production-plan.json
      - name: Validate SORA production plan
        run: npm run validate:plan -- projects/sora/production/production-plan.json
      - name: Validate VALORANT explainer production plan
        run: npm run validate:plan -- projects/valorant-immortal-decision-making/production/production-plan.json
      - name: Generate original audio fixtures
        run: npm run assets:audio
      - name: Stage Golden Hour audio fixtures for validation
        run: |
          PROJECT_DIR="projects/golden-hour-dog-walk"
          mkdir -p "$PROJECT_DIR/assets/audio"
          cp projects/sora/assets/audio/score.wav "$PROJECT_DIR/assets/audio/score.wav"
          cp projects/showcase-motion/assets/audio/transition-whoosh.wav "$PROJECT_DIR/assets/audio/transition-whoosh.wav"
          test -s "$PROJECT_DIR/assets/audio/score.wav"
          test -s "$PROJECT_DIR/assets/audio/transition-whoosh.wav"
      - name: Validate Golden Hour ProjectVideo source
        run: npm run validate:project -- projects/golden-hour-dog-walk/scene.json
      - name: Prepare Golden Hour audio mix
        run: npm run audio:prepare -- projects/golden-hour-dog-walk/scene.json
      - name: Enforce Golden Hour local asset evidence
        run: |
          mkdir -p review-output
          REPORT_PATH="review-output/golden-hour.asset-evidence.json"
          npm run director:asset-evidence -- projects/golden-hour-dog-walk/production/production-plan.json projects/golden-hour-dog-walk/production/asset-manifest.json "$REPORT_PATH"
          node - "$REPORT_PATH" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log(JSON.stringify({ summary: report.summary, issues: report.issues }, null, 2));
          const hasWarningsOrErrors = report.issues.some((issue) => issue.severity === "warning" || issue.severity === "error");
          const requiredAssetUsageIsIncomplete =
            report.summary.requiredAssetCount !== 6 ||
            report.summary.requiredAssetsReferenced !== 6 ||
            report.summary.requiredAssetsNotReferenced !== 0 ||
            report.summary.requiredAssetsUnverifiable !== 0 ||
            report.summary.requiredAssetsVerifiedInAssignedShots !== 4 ||
            report.summary.requiredAssetsMissingFromAssignedShots !== 0 ||
            report.summary.requiredAssetsShotUsageUnverifiable !== 0 ||
            report.summary.requiredAssetsShotUsageNotAudited !== 0;
          if (hasWarningsOrErrors || requiredAssetUsageIsIncomplete || report.summary.status === "criteria-unavailable" || report.summary.status === "no-assets") {
            console.error("Golden Hour production asset evidence is not strict-ready or required asset usage was not fully verified.");
            process.exit(1);
          }
          NODE
      - name: Verify Stormlight Keeper audio fixtures
        run: |
          test -s projects/stormlight-keeper/assets/audio/stormlight-score.wav
          test -s projects/stormlight-keeper/assets/audio/stormlight-atmosphere.wav
          ffprobe -v error -show_entries format=duration -of csv=p=0 projects/stormlight-keeper/assets/audio/stormlight-score.wav
          ffprobe -v error -show_entries format=duration -of csv=p=0 projects/stormlight-keeper/assets/audio/stormlight-atmosphere.wav
      - name: Verify Jumping Cat wind ambience
        run: |
          test -s packages/video-engine/public/audio/jumping-cat-wind.wav
          ffprobe -v error -show_entries format=duration -of csv=p=0 packages/video-engine/public/audio/jumping-cat-wind.wav
      - name: Enforce Stormlight Keeper local asset evidence
        run: |
          mkdir -p review-output
          npm run director:asset-evidence -- projects/stormlight-keeper/production/production-plan.json projects/stormlight-keeper/production/asset-manifest.json review-output/stormlight-keeper.asset-evidence.json --strict
      - name: Stage VALORANT audio fixtures for validation
        run: |
          PROJECT_DIR="projects/valorant-immortal-decision-making"
          mkdir -p "$PROJECT_DIR/assets/audio"
          cp projects/showcase-pulse/assets/audio/score.wav "$PROJECT_DIR/assets/audio/score.wav"
          cp projects/showcase-motion/assets/audio/transition-whoosh.wav "$PROJECT_DIR/assets/audio/transition-whoosh.wav"
          cp projects/showcase-motion/assets/audio/impact.wav "$PROJECT_DIR/assets/audio/impact.wav"
          cp projects/showcase-motion/assets/audio/transition-chime.wav "$PROJECT_DIR/assets/audio/transition-chime.wav"
      - name: Validate original demo project
        run: npm run validate:demo
      - name: Validate legacy data-driven example
        run: npm run validate:project -- projects/examples/three-scene-story/scene.json
      - name: Validate Aether motion showcase
        run: npm run validate:project -- projects/showcase-motion/scene.json
      - name: Validate cinematic transition showcase
        run: npm run validate:project -- projects/showcase-transitions/scene.json
      - name: Validate SORA product film
        run: npm run validate:project -- projects/sora/scene.json
      - name: Validate narrated explainer project
        run: npm run validate:project -- projects/examples/narrated-explainer/scene.json
      - name: Validate VALORANT explainer project
        run: npm run validate:project -- projects/valorant-immortal-decision-making/scene.json
      - name: Prepare VALORANT explainer audio mix
        run: npm run audio:prepare -- projects/valorant-immortal-decision-making/scene.json
      - name: Validate narrated custom composition metadata
        run: node -e 'const p = JSON.parse(require("node:fs").readFileSync("projects/examples/narrated-explainer/composition.json", "utf8")); if (p.schemaVersion !== 1 || p.composition.id !== "NarratedSkyExplainer" || p.composition.width !== 1920 || p.composition.height !== 1080 || p.composition.fps !== 30 || p.composition.durationInFrames !== 600) throw new Error("Invalid NarratedSkyExplainer metadata");'
      - name: Prepare track DSP and sidechain processing
        run: npm run audio:prepare -- projects/showcase-motion/scene.json
      - name: Build studio
        run: npm run build
