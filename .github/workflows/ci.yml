name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - render-request.json
      - circleci-status-request.json
  pull_request:
    branches: [main]
    paths-ignore:
      - render-request.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Generate original audio fixtures
        run: npm run assets:audio
      - name: Validate original demo project
        run: npm run validate:demo
      - name: Validate legacy data-driven example
        run: npm run validate:project -- projects/examples/three-scene-story/scene.json
      - name: Validate Aether motion showcase
        run: npm run validate:project -- projects/showcase-motion/scene.json
      - name: Validate cinematic transition showcase
        run: npm run validate:project -- projects/showcase-transitions/scene.json
      - name: Prepare track DSP and sidechain processing
        run: npm run audio:prepare -- projects/showcase-motion/scene.json
      - name: Resolve Remotion composition with Aether project props
        run: npx remotion compositions packages/video-engine/src/index.ts --props=projects/showcase-motion/.render-project.json --public-dir="$GITHUB_WORKSPACE/projects/showcase-motion"
      - name: Render Aether motion design showcase
        run: |
          mkdir -p render-output
          npm run render:custom -- ProjectVideo ../../render-output/aether-motion-showcase.mp4 --props=../../projects/showcase-motion/.render-project.json --public-dir=../../projects/showcase-motion
      - name: Master final audio
        run: npm run audio:master -- render-output/aether-motion-showcase.mp4 projects/showcase-motion/scene.json
      - name: Resolve Remotion composition for transition showcase
        run: npx remotion compositions packages/video-engine/src/index.ts --props=projects/showcase-transitions/scene.json --public-dir="$GITHUB_WORKSPACE/projects/showcase-transitions"
      - name: Render cinematic transition showcase
        run: |
          npm run render:custom -- ProjectVideo ../../render-output/cinematic-transitions-showcase.mp4 --props=../../projects/showcase-transitions/scene.json --public-dir=../../projects/showcase-transitions
      - name: Validate PULSE editorial showcase
        run: npm run validate:project -- projects/showcase-pulse/scene.json
      - name: Resolve Remotion composition for PULSE showcase
        run: npx remotion compositions packages/video-engine/src/index.ts --props=projects/showcase-pulse/scene.json
      - name: Render PULSE editorial motion film
        run: |
          npm run render:custom -- ProjectVideo ../../render-output/pulse-editorial-film.mp4 --props=../../projects/showcase-pulse/scene.json
      - name: Build studio
        run: npm run build
      - name: Upload Aether showcase video
        uses: actions/upload-artifact@v4
        with:
          name: aether-motion-showcase
          path: render-output/aether-motion-showcase.mp4
          if-no-files-found: error
          retention-days: 3
      - name: Upload cinematic transition showcase
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-transitions-showcase
          path: render-output/cinematic-transitions-showcase.mp4
          if-no-files-found: error
          retention-days: 3
