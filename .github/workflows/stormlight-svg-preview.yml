name: Stormlight SVG asset previews

on:
  push:
    branches: ["feat/stormlight-keeper"]
    paths:
      - "projects/stormlight-keeper/assets/*.svg"
      - "scripts/preview-stormlight-svgs.mjs"
      - ".github/workflows/stormlight-svg-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/preview-stormlight-svgs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stormlight-svg-previews
          path: review-output/svg-previews/
          retention-days: 7
