version: 2.1

parameters:
  render_video:
    type: boolean
    default: false
  project_path:
    type: string
    default: projects/demo/scene.json
  composition_id:
    type: string
    default: DemoVideo
  narration_path:
    type: string
    default: ""
  output_name:
    type: string
    default: ai-video-studio-circleci
  request_id:
    type: string
    default: manual

jobs:
  render:
    docker:
      - image: cimg/node:22-browsers
    resource_class: medium
    working_directory: ~/project
    environment:
      PROJECT_PATH: << pipeline.parameters.project_path >>
      COMPOSITION_ID: << pipeline.parameters.composition_id >>
      OUTPUT_NAME: << pipeline.parameters.output_name >>
      NARRATION_PATH: << pipeline.parameters.narration_path >>
      REQUEST_ID: << pipeline.parameters.request_id >>
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install --no-audit --no-fund
      - run:
          name: Ensure FFmpeg is available
          command: |
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
            ffmpeg -version | head -n 1
      - run:
          name: Generate original audio fixtures
          command: npm run assets:audio
      - run:
          name: Validate render inputs
          command: |
            set -Eeuo pipefail
            if [[ ! "$COMPOSITION_ID" =~ ^[A-Za-z][A-Za-z0-9_-]{0,63}$ ]]; then
              echo "composition_id must be a safe Remotion composition identifier"
              exit 1
            fi
            if [[ ! "$OUTPUT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,59}$ ]]; then
              echo "output_name must contain 1-60 letters, numbers, or hyphens"
              exit 1
            fi
            if [[ -n "$PROJECT_PATH" ]]; then
              case "$PROJECT_PATH" in
                projects/*.json) ;;
                *) echo "project_path must point inside projects/"; exit 1 ;;
              esac
              if [[ "$PROJECT_PATH" == *".."* || ! -f "$PROJECT_PATH" ]]; then
                echo "project_path must be an existing JSON file without traversal segments"
                exit 1
              fi
              node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$PROJECT_PATH"
            fi
            if [[ -n "$NARRATION_PATH" ]]; then
              case "$NARRATION_PATH" in
                projects/*.json) ;;
                *) echo "narration_path must point inside projects/"; exit 1 ;;
              esac
              if [[ "$NARRATION_PATH" == *".."* || ! -f "$NARRATION_PATH" ]]; then
                echo "narration_path must be an existing JSON file without traversal segments"
                exit 1
              fi
              node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$NARRATION_PATH"
              if [[ "$COMPOSITION_ID" != "ProjectVideo" || -z "$PROJECT_PATH" ]]; then
                echo "Narration requires a ProjectVideo request with project_path"
                exit 1
              fi
            fi
            if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
              if [[ -z "$PROJECT_PATH" ]]; then
                echo "ProjectVideo requires project_path"
                exit 1
              fi
              npm run validate:project -- "$PROJECT_PATH"
            fi
      - run:
          name: Generate optional narration and word alignment
          command: |
            if [[ -z "$NARRATION_PATH" ]]; then
              exit 0
            fi
            python3 --version
            python3 -m venv .venv-tts
            . .venv-tts/bin/activate
            pip install --disable-pip-version-check -r requirements-tts.txt
            PROJECT_DIR="$(dirname "$PROJECT_PATH")"
            python scripts/generate-narration.py \
              --config "$NARRATION_PATH" \
              --project-dir "$PROJECT_DIR" \
              --model-dir "$HOME/.cache/ai-video-studio/kokoro-v1.0"
            npm run narration:apply -- "$PROJECT_PATH" "$NARRATION_PATH" "$PROJECT_DIR/production/narration-alignment.json"
            echo "export PROJECT_PATH=$PROJECT_DIR/.narrated-project.json" >> "$BASH_ENV"
            export PROJECT_PATH="$PROJECT_DIR/.narrated-project.json"
      - run:
          name: Prepare project audio processing
          command: |
            if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
              npm run audio:prepare -- "$PROJECT_PATH"
            fi
      - run:
          name: Render MP4
          command: |
            set -Eeuo pipefail
            mkdir -p render-output
            echo "Rendering request: $REQUEST_ID"
            if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
              PROJECT_DIR="$(dirname "$PROJECT_PATH")"
              npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4" "--props=../../$PROJECT_DIR/.render-project.json" "--public-dir=../../$PROJECT_DIR"
            elif [[ -n "$PROJECT_PATH" ]]; then
              PROJECT_DIR="$(dirname "$PROJECT_PATH")"
              npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4" "--props=../../$PROJECT_PATH" "--public-dir=../../$PROJECT_DIR"
            else
              npm run render:custom -- "$COMPOSITION_ID" "../../render-output/$OUTPUT_NAME.mp4"
            fi
      - run:
          name: Master final audio
          command: |
            if [[ "$COMPOSITION_ID" == "ProjectVideo" ]]; then
              npm run audio:master -- "render-output/$OUTPUT_NAME.mp4" "$PROJECT_PATH"
            fi
      - store_artifacts:
          path: render-output
          destination: renders

workflows:
  render-video:
    when: << pipeline.parameters.render_video >>
    jobs:
      - render
